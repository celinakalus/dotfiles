# TV monitor
output "Philips Consumer Electronics Company Philips FTV 0x01010101" {
	mode 1920x1080@60Hz
	position 960 0
}

# Dual monitor home desk setup
output "AOC 2369M BRSE19A000805" {
	mode 1920x1080@60Hz
	position 0 1080
}

output "AOC 2369M ABPEA9A004752" {
	mode 1920x1080@60Hz
	position 1920 1080
}

output "HP Inc. HP E230t 6CM7101021" {
	mode 1920x1080@60Hz
	position 0 1080
}

input "8146:20737:Melfas_LGD_AIT_Touch_Controller" {
	map_to_output DP-2
}

workspace 0 output "Philips Consumer Electronics Company Philips FTV 0x01010101"
workspace 1 output "AOC 2369M BRSE19A000805"
workspace 2 output "AOC 2369M ABPEA9A004752"
workspace 2 output "HP Inc. HP E230t 6CM7101021"

# Audio buttons, assuming wireplumber
set $volume wpctl set-volume @DEFAULT_AUDIO_SINK@
set $mute wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym XF86AudioLowerVolume exec $volume 5%-
bindsym XF86AudioRaiseVolume exec $volume 5%+
bindsym XF86AudioMute exec $mute

# Brightness buttons, assuming intel backlight and brightnessctl
set $brightness brightnessctl -d intel_backlight set
bindsym XF86MonBrightnessUp exec $brightness 5%+
bindsym XF86MonBrightnessDown exec $brightness 5%-

exec --no-startup-id mako
